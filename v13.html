<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Muse v13 — 3D test</title><style>*{box-sizing:border-box}body{margin:0;background:#100d1b;color:#f8f3ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}header{padding:22px 18px 10px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:24px}header small{font-size:12px;color:#c5b4da}.pill,button{background:#30223e;border:1px solid #806392;border-radius:25px;color:white;padding:11px 15px;font-size:14px;touch-action:manipulation}#stage{height:410px;position:relative;background:radial-gradient(ellipse at center,#35203d 0%,#100d1b 70%)}canvas{width:100%;height:100%;display:block}#status{position:absolute;bottom:0;width:100%;text-align:center;color:#dfcdea;font-size:13px;display:none}#fallback{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-size:90px}.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:8px 10px 16px}.actions button:active{background:#72518b}.note{text-align:center;color:#a997bc;font-size:12px;padding:0 15px 14px}.chat{border-top:1px solid #34263f;padding:18px;min-height:190px}.bubble{display:inline-block;background:#30233d;border-radius:20px;padding:15px;line-height:1.6;max-width:90%}.entry{position:fixed;bottom:0;left:0;right:0;background:#1d1529;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.entry input{flex:1;min-width:0;border:1px solid #856494;border-radius:28px;background:#30243b;color:white;font-size:16px;padding:12px}.entry button{background:#ae86ce;color:#160d1c;font-weight:bold}main{padding-bottom:100px}</style></head><body><header><div><strong>Muse</strong> <small>3Dテスト v13</small></div><button id="reset" class="pill">↻ 正面に戻す</button></header><main><div id="stage"><div id="fallback">☁️</div><div id="status">3Dモデルを読み込み中…</div></div><div class="actions"><button data-act="wave">👋 手を振る</button><button data-act="happy">✨ 喜ぶ</button><button data-act="sleep">💤 眠る</button><button data-act="talk">💬 おしゃべり</button><button data-act="look">👀 キョロキョロ</button></div><div class="note">v13：丸い頭・自然な裾・小さな腕。指で回転できます。</div><section class="chat" id="chat"><div class="bubble">こんにちは！Museだよ ☁️<br>裾もふわっとした姿を試してみてね！</div></section></main><form class="entry" id="form"><input id="message" placeholder="Museに話しかけてね…" autocomplete="off"><button type="submit">➤</button></form><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const stage=document.getElementById('stage'), status=document.getElementById('status');let renderer;
try {const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(36,1,.1,100);camera.position.set(0,.05,7.8);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);const root=new THREE.Group();scene.add(root);const bodyGroup=new THREE.Group();root.add(bodyGroup);
scene.add(new THREE.HemisphereLight(0xffffff,0xb3a0d9,2.3));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(-3,5,6);scene.add(light);const fill=new THREE.DirectionalLight(0xd8baff,1.2);fill.position.set(3,0,-4);scene.add(fill);
const fur=new THREE.MeshStandardMaterial({color:0xf3eaff,roughness:1,metalness:0,flatShading:false});const pink=new THREE.MeshStandardMaterial({color:0xffa9d1,roughness:1});const dark=new THREE.MeshStandardMaterial({color:0x1c1027,roughness:.2});const shine=new THREE.MeshBasicMaterial({color:0xffffff});
// Smooth continuous ghost silhouette: rounded dome, gently flared lower body,
// and a CLOSED, softly scalloped bottom (not a flat open cut).
const rings=66, sides=96, vertices=[], indices=[];
function radiusAt(y){
  if(y>0.35){let u=Math.min(1,(y-.35)/1.03);return .78*Math.sqrt(Math.max(0,1-u*u));}
  if(y>-.62)return .78+(-.62-y)*.09;
  let u=Math.min(1,(-.62-y)/.70);return .78+.20*u*u;
}
for(let j=0;j<=rings;j++){
  let y=-1.32+2.70*j/rings, r=radiusAt(y);
  for(let i=0;i<=sides;i++){
    let a=2*Math.PI*i/sides;
    let scallop=Math.pow(Math.max(0,(-.77-y)/.55),2)*.105*Math.cos(7*a+.2);
    vertices.push(r*Math.cos(a),y+scallop,r*Math.sin(a));
  }
}
for(let j=0;j<rings;j++)for(let i=0;i<sides;i++){
  let p=j*(sides+1)+i,q=p+sides+1;
  indices.push(p,q,p+1,q,q+1,p+1);
}
// Round the underside inward, preventing the visible flat horizontal cutoff.
const bottomCenter=vertices.length/3;vertices.push(0,-1.37,0);
for(let i=0;i<sides;i++)indices.push(bottomCenter,i+1,i);
const bodyGeo=new THREE.BufferGeometry();bodyGeo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));bodyGeo.setIndex(indices);bodyGeo.computeVertexNormals();
const shape=new THREE.Mesh(bodyGeo,fur);bodyGroup.add(shape);
const sphere=(parent,mat,x,y,z,sx,sy,sz)=>{let m=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m};
const leftArm=new THREE.Group(),rightArm=new THREE.Group();leftArm.position.set(-.73,-.47,.03);rightArm.position.set(.73,-.47,.03);bodyGroup.add(leftArm,rightArm);sphere(leftArm,fur,-.10,-.08,.055,.18,.23,.19).rotation.z=-.35;sphere(rightArm,fur,.10,-.08,.055,.18,.23,.19).rotation.z=.35;
const eyes=[];for(const x of [-.31,.31]){const eye=sphere(bodyGroup,dark,x,.52,.695,.135,.185,.105);eyes.push(eye);sphere(bodyGroup,shine,x-.04,.60,.79,.042,.052,.022);sphere(bodyGroup,pink,x*1.28,.25,.705,.21,.095,.045)}
const smile=new THREE.Group();bodyGroup.add(smile);const pts=[];for(let i=0;i<=24;i++){let a=Math.PI*.15+Math.PI*.7*i/24;pts.push(new THREE.Vector3(.16*Math.cos(a),.35-.105*Math.sin(a),.79))}let curve=new THREE.CatmullRomCurve3(pts);let mouth=new THREE.Mesh(new THREE.TubeGeometry(curve,24,.021,6,false),dark);smile.add(mouth);
// Fine tufts placed directly on body surface for subtle fuzzy texture.
const tuftMat=new THREE.LineBasicMaterial({color:0xfaf5ff,transparent:true,opacity:.23});const verts=[];for(let i=0;i<2500;i++){let y=-1.27+Math.random()*2.57;let r=radiusAt(y);let a=Math.random()*Math.PI*2;let x=r*Math.cos(a),z=r*Math.sin(a),len=.012+Math.random()*.024;verts.push(x,y,z,x+Math.cos(a)*len,y+(Math.random()-.5)*.03,z+Math.sin(a)*len)}const tuftGeo=new THREE.BufferGeometry();tuftGeo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));bodyGroup.add(new THREE.LineSegments(tuftGeo,tuftMat));
let mode='idle',until=0,drag=false,lastX=0,rotation=0;stage.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(drag){rotation+=(e.clientX-lastX)*.009;lastX=e.clientX}});stage.addEventListener('pointerup',()=>drag=false);document.getElementById('reset').onclick=()=>rotation=0;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{mode=b.dataset.act;until=performance.now()+2600;status.textContent={wave:'手を振っているよ 👋',happy:'うれしい！ ✨',sleep:'おやすみ… 💤',talk:'おしゃべり中 💬',look:'キョロキョロ 👀'}[mode]});function resize(){let w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener('resize',resize);resize();status.textContent='Museはここにいるよ ✨';let t=0;function animate(now){requestAnimationFrame(animate);t=now*.001;if(now>until){mode='idle';status.textContent='Museはここにいるよ ✨'}root.position.y=Math.sin(t*1.7)*.085+(mode==='happy'?Math.abs(Math.sin(t*9))*.23:0);bodyGroup.rotation.z=mode==='happy'?Math.sin(t*10)*.12:mode==='sleep'?Math.sin(t)*.12:Math.sin(t*1.3)*.025;root.rotation.y=rotation+(mode==='look'?Math.sin(t*4)*.24:0);leftArm.rotation.z=mode==='wave'?Math.sin(t*10)*.65:0;rightArm.rotation.z=mode==='wave'?Math.sin(t*10+1)*.65:0;let blink=Math.sin(t*1.23)> .985?.09:1;eyes.forEach(e=>e.scale.y=.205*(mode==='sleep'?.08:blink));smile.scale.y=mode==='talk'?1+Math.sin(t*14)*.4:1;renderer.render(scene,camera)}requestAnimationFrame(animate);
}catch(err){document.getElementById('fallback').style.display='flex';status.textContent='3Dの読み込みに失敗しました。通信環境を確認してね。';console.error(err)}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('message');const v=input.value.trim();if(!v)return;const p=document.createElement('p');p.className='bubble';p.textContent=v;document.getElementById('chat').append(p);const r=document.createElement('p');r.className='bubble';r.textContent='話しかけてくれてありがとう！💜 まだデモ会話だから、AI接続はこれからだよ。';document.getElementById('chat').append(r);input.value='';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})});
</script></body></html>
